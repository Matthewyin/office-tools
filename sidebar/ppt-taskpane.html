<!DOCTYPE html>
<html lang="zh-CN" data-office-app="ppt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSSA_PPT</title>
  <link rel="preconnect" href="https://appsforoffice.microsoft.com" crossorigin />
  <link rel="dns-prefetch" href="//appsforoffice.microsoft.com" />
  <!-- Office.js 必须从 CDN 加载，且必须在所有其他脚本之前 -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="/src/taskpane.css" />
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
      <path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.04.04a2.1 2.1 0 0 1-2.97 2.97l-.04-.04a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.09 1.65V21.3a2.1 2.1 0 0 1-4.2 0v-.06a1.8 1.8 0 0 0-1.09-1.65 1.8 1.8 0 0 0-1.98.36l-.04.04a2.1 2.1 0 0 1-2.97-2.97l.04-.04A1.8 1.8 0 0 0 3.8 15a1.8 1.8 0 0 0-1.65-1.09H2.1a2.1 2.1 0 0 1 0-4.2h.06A1.8 1.8 0 0 0 3.8 8.62a1.8 1.8 0 0 0-.36-1.98l-.04-.04a2.1 2.1 0 0 1 2.97-2.97l.04.04a1.8 1.8 0 0 0 1.98.36A1.8 1.8 0 0 0 9.5 2.38V2.1a2.1 2.1 0 0 1 4.2 0v.06a1.8 1.8 0 0 0 1.09 1.65 1.8 1.8 0 0 0 1.98-.36l.04-.04a2.1 2.1 0 0 1 2.97 2.97l-.04.04a1.8 1.8 0 0 0-.36 1.98 1.8 1.8 0 0 0 1.65 1.09h.06a2.1 2.1 0 0 1 0 4.2h-.06A1.8 1.8 0 0 0 19.4 15Z"/>
    </symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="m4 20 4.5-1 10.7-10.7a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z"/>
      <path d="m14.5 6.5 3 3"/>
    </symbol>
    <symbol id="icon-language" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5h10"/>
      <path d="M9 3v2"/>
      <path d="M11 5c-.8 4.4-3.4 7.2-7 9"/>
      <path d="M5.5 8.5c1.2 2.2 3.2 4 5.5 5"/>
      <path d="M14 21l4-9 4 9"/>
      <path d="M15.3 18h5.4"/>
    </symbol>
    <symbol id="icon-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 6h12"/>
      <path d="M8 12h12"/>
      <path d="M8 18h12"/>
      <path d="M4 6h.01"/>
      <path d="M4 12h.01"/>
      <path d="M4 18h.01"/>
    </symbol>
    <symbol id="icon-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19V5"/>
      <path d="M4 19h16"/>
      <path d="M8 16v-5"/>
      <path d="M12 16V8"/>
      <path d="M16 16v-3"/>
    </symbol>
    <symbol id="icon-table-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="13" height="13" rx="2"/>
      <path d="M3 9h13"/>
      <path d="M8 4v13"/>
      <path d="M19 11v6"/>
      <path d="M16 14h6"/>
    </symbol>
    <symbol id="icon-preview" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/>
      <circle cx="12" cy="12" r="2.5"/>
    </symbol>
    <symbol id="icon-formula" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 5h14"/>
      <path d="M5 19h14"/>
      <path d="m8 8 4 4-4 4"/>
      <path d="M14 16h3"/>
    </symbol>
    <symbol id="icon-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M9.8 9.5a2.4 2.4 0 1 1 3.8 2c-.9.6-1.6 1.1-1.6 2.3"/>
      <path d="M12 17h.01"/>
    </symbol>
    <symbol id="icon-layout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="5" width="16" height="14" rx="2"/>
      <path d="M4 10h16"/>
      <path d="M10 10v9"/>
    </symbol>
    <symbol id="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
      <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
      <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
      <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
    </symbol>
    <symbol id="icon-paperclip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="m21 11-8.5 8.5a5 5 0 0 1-7.1-7.1l9.2-9.2a3.4 3.4 0 0 1 4.8 4.8l-9.2 9.2a1.8 1.8 0 0 1-2.5-2.5L16 6.4"/>
    </symbol>
    <symbol id="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="m4 12 16-8-5 16-3-7-8-1Z"/>
      <path d="m12 13 8-9"/>
    </symbol>
    <symbol id="icon-insert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h9l3 3v15H6V3Z"/>
      <path d="M14 3v4h4"/>
      <path d="M12 11v6"/>
      <path d="M9 14h6"/>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="11" height="11" rx="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18"/>
      <path d="m6 6 12 12"/>
    </symbol>
    <symbol id="icon-new-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h8"/>
      <path d="M19 3v8"/>
      <path d="M15 7h8"/>
    </symbol>
    <symbol id="icon-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 3-6.7"/>
      <path d="M3 4v5h5"/>
      <path d="M12 7v5l3 2"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16"/>
      <path d="M10 11v6"/>
      <path d="M14 11v6"/>
      <path d="M6 7l1 14h10l1-14"/>
      <path d="M9 7V4h6v3"/>
    </symbol>
    <symbol id="icon-more" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="1"/>
      <circle cx="19" cy="12" r="1"/>
      <circle cx="5" cy="12" r="1"/>
    </symbol>
  </svg>
  <div id="app">

    <!-- 顶部标题栏 -->
    <header class="header">
      <div class="header-title">
        <svg class="icon"><use href="#icon-layout"></use></svg>
        <span>NSSA_PPT</span>
      </div>
      <div class="header-actions">
        <button id="btn-new-chat" class="icon-btn" title="新建对话" data-tooltip="新建对话" aria-label="新建对话">
          <svg class="icon"><use href="#icon-new-chat"></use></svg>
        </button>
        <button id="btn-history-toggle" class="icon-btn" title="对话历史" data-tooltip="对话历史" aria-label="打开对话历史">
          <svg class="icon"><use href="#icon-history"></use></svg>
        </button>
        <button id="btn-settings-toggle" class="icon-btn" title="设置" data-tooltip="设置" aria-label="打开设置">
          <svg class="icon"><use href="#icon-settings"></use></svg>
        </button>
      </div>
    </header>

    <section id="history-panel" class="history-panel hidden" aria-label="对话历史">
      <div id="conversation-list" class="conversation-list"></div>
    </section>

    <!-- 设置面板（默认折叠） -->
    <section id="settings-panel" class="settings-panel hidden" aria-label="模型设置">
      <div class="settings-body">
        <div class="settings-block">
          <div class="settings-block-header">
            <span class="field-label">助手行为</span>
            <span class="settings-hint">影响每次普通聊天</span>
          </div>
          <label class="config-field" for="input-system-prompt">
            <span>系统提示词</span>
            <textarea id="input-system-prompt" class="textarea system-prompt-input" rows="5" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="例如：你是一个专业的文档润色助手，请用简洁准确的中文回答。"></textarea>
          </label>
          <label class="checkbox-row">
            <input id="input-web-search-enabled" type="checkbox" />
            <span>启用网页搜索</span>
          </label>
          <p class="settings-hint">开启后，涉及最新资料或外部事实的问题会调用本地后端搜索工具。</p>
        </div>

        <div class="settings-block">
          <div class="settings-row">
            <div>
              <span class="field-label">模型配置</span>
              <p class="settings-hint">每条配置保存一个供应商连接，可添加多个 Model。</p>
            </div>
            <button id="btn-add-model" class="btn btn-secondary btn-sm" type="button">添加配置</button>
          </div>
          <div id="model-config-list" class="model-config-list"></div>
        </div>

        <button id="btn-save-settings" class="btn btn-primary">保存配置</button>
        <p id="settings-status" class="status-text"></p>
      </div>
    </section>

    <!-- 主交互区 -->
    <main class="chat-shell">
      <section id="chat-window" class="chat-window" aria-label="聊天窗口">
        <div id="chat-messages" class="chat-messages"></div>
      </section>

      <section id="context-status" class="context-status" aria-label="当前上下文状态">
        <span id="context-status-backend" class="context-chip">后端：检测中</span>
        <span id="context-status-chat" class="context-chip">对话：短历史</span>
        <span id="context-status-doc" class="context-chip">文档：未索引</span>
        <span id="context-status-evidence" class="context-chip context-chip-muted">段落：未使用</span>
        <button id="context-status-tools" class="context-chip context-chip-button context-chip-muted" type="button">工具：未使用</button>
      </section>

      <section id="tool-context-panel" class="tool-context-panel hidden" aria-label="工具上下文">
        <div class="tool-context-header">
          <span>工具上下文</span>
          <button id="btn-tool-context-close" class="icon-btn" type="button" title="关闭" aria-label="关闭工具上下文">
            <svg class="icon"><use href="#icon-close"></use></svg>
          </button>
        </div>
        <div id="tool-context-body" class="tool-context-body"></div>
      </section>

      <!-- 执行前确认 -->
      <section id="action-preview" class="action-preview hidden" aria-label="执行前确认">
        <div>
          <span class="section-title">待执行操作</span>
          <p id="action-preview-text" class="preview-text"></p>
        </div>
        <div class="btn-row">
          <button id="btn-cancel-action" class="btn btn-secondary btn-sm">取消</button>
          <button id="btn-confirm-action" class="btn btn-primary btn-sm">确认执行</button>
        </div>
      </section>

      <section class="composer" aria-label="聊天输入栏">
        <textarea id="input-user-prompt" class="composer-input" rows="3" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入问题，或输入“找到文档中的XX，替换为YY”..."></textarea>
        <div class="composer-toolbar">
          <div class="composer-tools">
            <button id="btn-read-selection" class="icon-tool" title="读取当前 Word/Excel/PPT 选中内容到输入框" aria-label="读取当前 Word、Excel 或 PowerPoint 选中内容到输入框">
              <svg class="icon"><use href="#icon-paperclip"></use></svg>
            </button>
            <button id="btn-preview-action" class="icon-tool" title="预览会修改文档的操作，不会立即执行" aria-label="预览会修改文档的操作，不会立即执行">
              <svg class="icon"><use href="#icon-preview"></use></svg>
            </button>
          </div>
          <div class="composer-model">
            <select id="select-thinking" class="thinking-select" aria-label="选择思考深度">
              <option value="off">思考关</option>
              <option value="low">思考低</option>
              <option value="medium">思考中</option>
              <option value="high">思考高</option>
            </select>
            <select id="select-model" class="model-select" aria-label="选择 LLM"></select>
            <button id="btn-send" class="send-btn" title="发送" aria-label="发送">
              <svg class="icon"><use href="#icon-send"></use></svg>
            </button>
          </div>
        </div>
      </section>
    </main>

  </div>

  <script type="module" src="/src/ppt-main.js"></script>
</body>
</html>
